  • viewport-fit=cover + safe-area-inset  → supprime les bandes noires iOS

  • Valeurs de secours sur chaque var()   → texte lisible même si une variable échoue
  • Bloc « FILET DE SÉCURITÉ » en bas du CSS → couleurs garanties par écran
  • Logo intégré en base64                → fichier autonome, aucun lien externe

  NOUVEAU EN v6 : livraisons/entrées de stock, suggestion de commande,
  zones de comptage, quarts de bouteille, historique d'inventaires,

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="description" content="INVO Desktop — pilotez stocks, commandes, livraisons et ventes de votre restaurant.">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0D1728">
<title>INVO — Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F1EBDC;
  --surface:#FFFFFF;
  --surface-2:#E6DEC7;
  --border:#C9B98D;
  --ink:#1C1914;
  --steel-d:#4A4436;
  --accent:#7A4F0A;
  --accent-2:#8F5C0C;
  --accent-soft:#F8F2E5;
  --accent-soft-brd:#D9BE85;
  --green:#235A34;
  --green-soft:#EAF2EC;
  --amber:#7A4F0A;
  --amber-d:#5C3C08;
  --amber-soft:#F8F2E5;
  --red:#7E2F1B;
  --red-soft:#F9EAE4;
  --blue:#254A67;
  --blue-soft:#E9EFF4;
  --teal:#0F4E53;
  --teal-soft:#E6F1F0;
  --purple:#4F3D5E;
  --purple-soft:#EDE8F1;
  --gold:#AD7D26;
  --shadow:0 1px 3px rgba(28,25,20,.06),0 12px 28px rgba(28,25,20,.10);
  --shadow-sm:0 3px 14px rgba(28,25,20,.16);
  --shadow-card:0 1px 2px rgba(28,25,20,.05),0 1px 8px rgba(28,25,20,.05);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background-color:#F1EBDC;color:#1C1914;color-scheme:light;height:100%}
body{font-family:'Inter','Noto Sans Sinhala','Noto Sans Tamil',system-ui,sans-serif;
background-color:#F1EBDC;color:#1C1914;line-height:1.5;-webkit-font-smoothing:antialiased;
min-height:100vh;min-height:100dvh;width:100%;display:flex;flex-direction:column;overscroll-behavior:none}
.app{max-width:520px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;background-color:#F1EBDC}

.top{position:sticky;top:0;z-index:50;background:rgba(250,248,243,.92);backdrop-filter:blur(10px);
border-bottom:1px solid var(--border,#C9B98D);
padding:calc(14px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));
display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center}
.logo-img{height:30px;width:auto;display:block}
.top-right{display:flex;align-items:center;gap:8px}
.lang,.who-pill{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);color:var(--ink,#1C1914);
padding:7px 12px;border-radius:999px;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;
font-weight:600;display:flex;align-items:center;gap:6px;transition:border-color .15s}
.lang{letter-spacing:.03em}
.who-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--gold,#AD7D26)}

main{flex:1;padding:20px calc(20px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.screen{display:none;animation:in .25s ease}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.h-title{font-family:'Fraunces',serif;font-size:25px;font-weight:600;letter-spacing:-.01em;
margin-bottom:5px;color:var(--ink,#1C1914)}
.h-sub{font-size:13.5px;color:var(--steel-d,#4A4436);margin-bottom:18px;line-height:1.5}
.eyebrow{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
color:var(--accent,#7A4F0A);font-weight:700;margin-bottom:10px}

.conn{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);border-radius:14px;padding:15px 16px;margin-bottom:14px;box-shadow:var(--shadow-card)}
.conn-top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent,#7A4F0A);flex-shrink:0;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.conn-name{font-size:14.5px;font-weight:700;flex:1;color:var(--ink,#1C1914)}
.conn-state{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.06em;color:var(--accent,#7A4F0A);font-weight:700;text-transform:uppercase}
.conn-sub{font-size:11.5px;color:var(--steel-d,#4A4436)}
.conn-off .pulse{background:var(--steel-d,#4A4436);animation:none}
.conn-off .conn-state{color:var(--steel-d,#4A4436)}

.feed-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border,#C9B98D);
align-items:flex-start;animation:slidein .35s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.feed-row:last-child{border-bottom:none}
.f-ico{font-size:19px;width:26px;text-align:center;flex-shrink:0;margin-top:1px}
.f-body{flex:1;min-width:0}
.f-t{font-size:13.5px;font-weight:600;color:var(--ink,#1C1914)}
.f-m{font-size:10.5px;color:var(--steel-d,#4A4436);margin-top:2px;font-variant-numeric:tabular-nums}

.tag{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.05em;
padding:4px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0;text-transform:uppercase}
.tag.vente{background:var(--green-soft,#EAF2EC);color:var(--green,#235A34)}
.tag.offClient{background:var(--blue-soft,#E9EFF4);color:var(--blue,#254A67)}
.tag.offPart{background:var(--teal-soft,#E6F1F0);color:var(--teal,#0F4E53)}
.tag.offGroupe{background:var(--purple-soft,#EDE8F1);color:var(--purple,#4F3D5E)}
.tag.annul{background:var(--red-soft,#F9EAE4);color:var(--red,#7E2F1B)}
.tag.perso{background:var(--purple-soft,#EDE8F1);color:var(--purple,#4F3D5E)}
.tag.casse,.tag.rate{background:var(--red-soft,#F9EAE4);color:var(--red,#7E2F1B)}
.tag.degus,.tag.entame{background:var(--amber-soft,#F8F2E5);color:var(--amber,#7A4F0A)}
.src{font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.05em;padding:3px 7px;
border-radius:999px;font-weight:700;text-transform:uppercase}
.src.auto{background:var(--blue-soft,#E9EFF4);color:var(--blue,#254A67)}
.src.main{background:var(--amber-soft,#F8F2E5);color:var(--amber,#7A4F0A)}

.svc,.seg,.subtabs{display:flex;gap:3px;background:var(--surface-2,#E6DEC7);padding:4px;border-radius:13px;margin-bottom:14px}
.svc button,.seg button,.subtabs button{flex:1;background:transparent;border:none;color:var(--steel-d,#4A4436);
padding:10px 8px;border-radius:10px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.svc button.on,.seg button.on,.subtabs button.on{background:var(--surface,#FFFFFF);color:var(--accent,#7A4F0A);box-shadow:var(--shadow-sm)}
.svc .si{font-size:15px}

.cats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cat{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);color:var(--steel-d,#4A4436);padding:9px 15px;
border-radius:999px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;white-space:nowrap;
cursor:pointer;flex-shrink:0;transition:all .15s}
.cat.on{background:var(--accent,#7A4F0A);border-color:var(--accent,#7A4F0A);color:#fff}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{position:relative;background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);border-radius:14px;box-shadow:var(--shadow-card);
padding:13px 7px 11px;text-align:center;cursor:pointer;color:var(--ink,#1C1914);font-family:inherit;
transition:transform .1s,border-color .15s,background .15s;display:flex;flex-direction:column;
align-items:center;gap:5px;min-height:96px;justify-content:center}
.card:active{transform:scale(.95)}
.card.has{border-color:var(--accent,#7A4F0A);background:var(--accent-soft,#F8F2E5)}
.card.add{border-style:dashed;color:var(--steel-d,#4A4436)}
.card .ico{font-size:24px;line-height:1}
.card .nm{font-size:10.5px;font-weight:600;line-height:1.25;color:var(--ink,#1C1914)}
.card .pxs{font-family:'Inter',sans-serif;font-size:9.5px;color:var(--steel-d,#4A4436);font-weight:700;
font-variant-numeric:tabular-nums}
.qbadge{position:absolute;top:-7px;right:-7px;background:var(--accent,#7A4F0A);color:#fff;min-width:22px;
height:22px;border-radius:999px;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:800;
display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg,#F1EBDC);
font-variant-numeric:tabular-nums}

.panier{background:var(--surface,#FFFFFF);border:1px solid var(--accent-soft-brd,#D9BE85);border-radius:14px;box-shadow:var(--shadow-card);
padding:6px 15px 13px;margin:16px 0}
.pk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border,#C9B98D)}
.pk-row:last-child{border-bottom:none}
.pk-ico{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.pk-body{flex:1;min-width:0}
.pk-n{font-size:13px;font-weight:600;line-height:1.3;color:var(--ink,#1C1914)}
.pk-c{font-size:10.5px;color:var(--steel-d,#4A4436);font-variant-numeric:tabular-nums}
.pk-ctrl{display:flex;align-items:center;gap:9px;flex-shrink:0}
.pk-btn{width:29px;height:29px;border-radius:9px;border:1px solid var(--border,#C9B98D);background:var(--surface-2,#E6DEC7);
color:var(--ink,#1C1914);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1;
display:flex;align-items:center;justify-content:center;transition:background .15s}
.pk-btn:active{background:var(--border,#C9B98D)}
.pk-q{font-family:'Inter',sans-serif;font-size:14.5px;font-weight:800;min-width:20px;text-align:center;
font-variant-numeric:tabular-nums}
.pk-head{display:flex;justify-content:space-between;align-items:center;padding:9px 0 5px}
.pk-title{font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.08em;color:var(--accent,#7A4F0A);
font-weight:700;text-transform:uppercase}
.pk-clear{background:none;border:none;color:var(--steel-d,#4A4436);font-family:'Inter',sans-serif;font-size:11px;
cursor:pointer;text-decoration:underline;font-weight:500}
.pk-total{display:flex;justify-content:space-between;align-items:center;padding-top:12px;margin-top:7px;
border-top:1px solid var(--border,#C9B98D)}
.pk-tl{font-size:12px;color:var(--steel-d,#4A4436)}
.pk-tv{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--accent,#7A4F0A)}

.motifs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.motif{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);border-radius:14px;box-shadow:var(--shadow-card);padding:14px 12px;
cursor:pointer;text-align:left;color:var(--ink,#1C1914);font-family:inherit;transition:all .15s}
.motif:active{transform:scale(.97)}
.motif.sel{border-color:var(--accent,#7A4F0A);background:var(--accent-soft,#F8F2E5)}
.motif .mi{font-size:20px;display:block;margin-bottom:6px}
.motif .mt{font-size:13px;font-weight:700;line-height:1.3;color:var(--ink,#1C1914)}
.motif .md{font-size:10.5px;color:var(--steel-d,#4A4436);margin-top:2px;line-height:1.35}

.btn{width:100%;padding:15px;border:none;border-radius:13px;cursor:pointer;font-family:'Inter',sans-serif;
font-size:15px;font-weight:700;background:var(--accent,#7A4F0A);color:#fff;transition:opacity .15s,background .15s}
.btn:disabled{opacity:1;background:var(--surface-2,#E6DEC7);color:var(--steel-d,#4A4436);border:1px solid var(--border,#C9B98D);cursor:not-allowed}
.btn:active:not(:disabled){opacity:.85}
.btn-2{background:var(--surface,#FFFFFF);color:var(--ink,#1C1914);border:1px solid var(--border,#C9B98D)}
.btn-del{background:var(--red-soft,#F9EAE4);color:var(--red,#7E2F1B);border:1px solid var(--red-soft,#F9EAE4)}
.btn-sm{padding:11px 16px;font-size:13px;width:auto;border-radius:11px}
.step-block{margin-bottom:20px}
.hint{background:var(--surface-2,#E6DEC7);border-radius:11px;padding:11px 13px;font-size:11.5px;
color:var(--steel-d,#4A4436);margin-bottom:14px;line-height:1.5}

.cartbar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;z-index:55;max-width:520px;margin:0 auto;
padding:0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));pointer-events:none}
.cartbar-in{background:var(--accent,#7A4F0A);color:#fff;border-radius:14px;padding:13px 17px;display:flex;
align-items:center;justify-content:space-between;gap:12px;pointer-events:auto;box-shadow:var(--shadow-sm);
animation:pop .25s cubic-bezier(.2,.9,.3,1);cursor:pointer}
.cb-l{font-size:12.5px;font-weight:700}
.cb-l small{display:block;font-family:'Inter',sans-serif;font-size:10px;opacity:.78;font-weight:700;
letter-spacing:.05em;margin-top:1px}
.cb-r{font-family:'Fraunces',serif;font-size:18px;font-weight:600}

.search{width:100%;background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);border-radius:12px;
padding:12px 15px;color:var(--ink,#1C1914);font-family:inherit;font-size:14px;margin-bottom:13px;outline:none;
transition:border-color .15s}
.search:focus{border-color:var(--accent,#7A4F0A)}

.line{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border,#C9B98D);
cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;
color:var(--ink,#1C1914);font-family:inherit;text-align:left}

/* Onglet Produits : fond sombre, texte clair — règles explicites, aucune variable partagée touchée */
/* Onglet Produits : fond beige comme les autres écrans, textes lisibles */
#s-stock{background-color:#F1EBDC}
#s-stock .h-title{color:#1C1914}
#s-stock .h-sub{color:#4A4436}
#s-stock .l-nm{color:#1C1914}
#s-stock .l-meta{color:#4A4436}
#s-stock .l-qty{color:#1C1914}
#s-stock .l-qty.low{color:#7A4F0A}
#s-stock .l-qty.out{color:#7E2F1B}
#s-stock .l-unit{color:#4A4436}
#s-stock .l-edit{color:#4A4436}
.line:last-child{border-bottom:none}
.l-ico{font-size:19px;width:26px;text-align:center;flex-shrink:0}
.l-body{flex:1;min-width:0}
.l-nm{font-size:13.5px;font-weight:600;color:var(--ink,#1C1914)}
.l-meta{font-size:10.5px;color:var(--steel-d,#4A4436);margin-top:1px;font-variant-numeric:tabular-nums}
.l-val{text-align:right;flex-shrink:0}
.l-qty{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:var(--ink,#1C1914);
font-variant-numeric:tabular-nums}
.l-qty.low{color:var(--amber,#7A4F0A)}
.l-qty.out{color:var(--red,#7E2F1B)}
.l-unit{font-size:10px;color:var(--steel-d,#4A4436)}
.l-edit{color:var(--steel-d,#4A4436);font-size:16px;flex-shrink:0;margin-left:2px}

.inv-head{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);border-radius:14px;box-shadow:var(--shadow-card);padding:15px 16px;margin-bottom:16px}
.inv-stat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--ink,#1C1914)}
.inv-stat b{font-family:'Inter',sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.inv-line{display:grid;grid-template-columns:1fr 54px 62px;gap:9px;align-items:center;padding:11px 0;
border-bottom:1px solid var(--border,#C9B98D)}
.inv-line.done{background:var(--green-soft,#EAF2EC)}
.inv-line.gap{background:var(--red-soft,#F9EAE4);margin:0 -8px;padding:11px 8px;border-radius:8px}
.iv-nm{font-size:13px;font-weight:600;color:var(--ink,#1C1914)}
.iv-sub{font-size:10px;color:var(--steel-d,#4A4436)}
.iv-att{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;text-align:right;color:var(--steel-d,#4A4436);
font-variant-numeric:tabular-nums}
.iv-inp{width:100%;background:var(--surface-2,#E6DEC7);border:1.5px solid var(--border,#C9B98D);border-radius:9px;
padding:9px 5px;color:var(--ink,#1C1914);font-family:'Inter',sans-serif;font-size:14px;font-weight:700;
text-align:center;outline:none;font-variant-numeric:tabular-nums;transition:border-color .15s}
.iv-inp.ok{border-color:var(--green,#235A34);color:var(--green,#235A34);background:var(--green-soft,#EAF2EC)}
.iv-inp.bad{border-color:var(--red,#7E2F1B);color:var(--red,#7E2F1B);background:var(--red-soft,#F9EAE4)}
.inv-actions{display:flex;gap:9px;margin:18px 0 8px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.kpi{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);border-radius:14px;box-shadow:var(--shadow-card);padding:15px 14px}
.kpi-v{font-family:'Fraunces',serif;font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1;
color:var(--ink,#1C1914)}
.kpi-l{font-size:10.5px;color:var(--steel-d,#4A4436);margin-top:6px;line-height:1.4}
.kpi.amber .kpi-v{color:var(--amber,#7A4F0A)}
.kpi.red .kpi-v{color:var(--red,#7E2F1B)}
.kpi.green .kpi-v{color:var(--green,#235A34)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.split-cell{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);border-radius:14px;box-shadow:var(--shadow-card);padding:16px 15px}
.sp-lab{font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.07em;font-weight:700;margin-bottom:8px;
text-transform:uppercase}
.sp-lab.a{color:var(--blue,#254A67)}
.sp-lab.b{color:var(--amber,#7A4F0A)}
.sp-v{font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:var(--ink,#1C1914)}
.sp-d{font-size:10.5px;color:var(--steel-d,#4A4436);margin-top:5px;line-height:1.45}

.bar-row{margin-bottom:12px}
.bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;gap:10px;color:var(--ink,#1C1914)}
.bar-top b{font-family:'Inter',sans-serif;flex-shrink:0;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--surface-2,#E6DEC7);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .5s ease}

.empty{text-align:center;padding:40px 20px;color:var(--steel-d,#4A4436)}
.empty .e-ico{font-size:34px;margin-bottom:12px;opacity:.4}
.empty p{font-size:13px;line-height:1.5}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(250,248,243,.94);
backdrop-filter:blur(10px);border-top:1px solid var(--border,#C9B98D);display:flex;max-width:520px;
margin:0 auto;padding-bottom:env(safe-area-inset-bottom);
padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.nav button{flex:1;background:none;border:none;cursor:pointer;color:var(--steel-d,#4A4436);padding:12px 3px 10px;
font-family:'Inter',sans-serif;font-size:8.5px;font-weight:600;display:flex;flex-direction:column;
align-items:center;gap:3px;transition:color .15s;position:relative;min-width:0;overflow:hidden}
.nav button .ni{font-size:18px;line-height:1}
.nav button.on{color:var(--accent,#7A4F0A)}
.nav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--accent,#7A4F0A)}
.badge{position:absolute;top:5px;right:50%;margin-right:-20px;background:var(--blue,#254A67);color:#fff;
font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:flex;
align-items:center;justify-content:center;padding:0 4px;font-family:'Inter',sans-serif;
box-shadow:0 0 0 2px var(--bg,#F1EBDC);font-variant-numeric:tabular-nums}
.badge.amb{background:var(--amber,#7A4F0A)}

.sheet-bg{position:fixed;inset:0;background:rgba(34,31,26,.4);z-index:100;display:flex;
align-items:flex-end;justify-content:center;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface,#FFFFFF);border-top:1px solid var(--border,#C9B98D);border-radius:22px 22px 0 0;
width:100%;max-width:520px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));
animation:up .28s cubic-bezier(.2,.8,.3,1);max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:-.01em;
margin-bottom:5px;color:var(--ink,#1C1914)}
.sh-sub{font-size:12.5px;color:var(--steel-d,#4A4436);margin-bottom:18px;line-height:1.5}

.opt{width:100%;background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);border-radius:13px;padding:14px;
margin-bottom:8px;cursor:pointer;color:var(--ink,#1C1914);font-family:inherit;font-size:14.5px;font-weight:600;
text-align:left;display:flex;align-items:center;gap:12px;transition:all .15s}
.opt.on{border-color:var(--accent,#7A4F0A);background:var(--accent-soft,#F8F2E5)}
.opt .oi{font-size:20px}
.opt small{display:block;font-size:11px;color:var(--steel-d,#4A4436);font-weight:500;margin-top:1px}

.fld{margin-bottom:14px}
.fld label{display:block;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.07em;
text-transform:uppercase;color:var(--steel-d,#4A4436);font-weight:700;margin-bottom:6px}
.fld input,.fld select{width:100%;background:var(--surface-2,#E6DEC7);border:1.5px solid var(--border,#C9B98D);
border-radius:11px;padding:11px 13px;color:var(--ink,#1C1914);font-family:inherit;font-size:14.5px;outline:none;
transition:border-color .15s}
.fld input:focus,.fld select:focus{border-color:var(--accent,#7A4F0A);background:var(--surface,#FFFFFF)}
.fld small{display:block;font-size:10.5px;color:var(--steel-d,#4A4436);margin-top:5px;line-height:1.4}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.f3{display:grid;grid-template-columns:64px 1fr;gap:11px}

.calc{background:var(--accent-soft,#F8F2E5);border:1px solid var(--accent-soft-brd,#D9BE85);border-radius:11px;
padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.calc-l{font-size:11.5px;color:var(--steel-d,#4A4436)}
.calc-v{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--accent,#7A4F0A)}

.ing-row{display:grid;grid-template-columns:1fr 74px 34px;gap:7px;align-items:center;margin-bottom:8px}
.ing-row select,.ing-row input{background:var(--surface-2,#E6DEC7);border:1.5px solid var(--border,#C9B98D);border-radius:9px;
padding:9px 8px;color:var(--ink,#1C1914);font-family:inherit;font-size:13px;outline:none;width:100%}
.ing-row input{font-family:'Inter',sans-serif;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ing-x{background:var(--red-soft,#F9EAE4);border:none;border-radius:9px;color:var(--red,#7E2F1B);font-size:15px;
cursor:pointer;height:37px;font-family:inherit}
.ing-add{width:100%;background:var(--surface-2,#E6DEC7);border:1.5px dashed var(--border,#C9B98D);border-radius:11px;
padding:12px;color:var(--steel-d,#4A4436);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
cursor:pointer;margin-top:5px}
.sh-actions{display:flex;gap:8px;margin-top:20px}
.pilot-actions{display:flex;gap:8px;align-items:stretch;flex-wrap:nowrap}
.pilot-actions #pilotStart{flex:1;min-width:0;white-space:nowrap}
.pilot-actions #resetDemo{flex:0 0 auto;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent,#7A4F0A);
color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:700;z-index:200;
white-space:nowrap;animation:pop .3s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow-sm)}
@keyframes pop{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

.banner{background:var(--blue-soft,#E9EFF4);border:1px solid transparent;border-left:3px solid var(--blue,#254A67);
border-radius:10px;padding:11px 14px;font-size:11.5px;color:var(--blue,#254A67);margin-bottom:15px;line-height:1.55}
.banner.amber{background:var(--amber-soft,#F8F2E5);border-left-color:var(--amber,#7A4F0A);color:var(--amber-d,#5C3C08)}
.reset{background:none;border:none;color:var(--steel-d,#4A4436);font-family:'Inter',sans-serif;font-size:11px;
cursor:pointer;text-decoration:underline;padding:8px 0;margin-top:20px;font-weight:500}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent,#7A4F0A);outline-offset:2px}

/* ── CONNEXION / COMPTES ── */
body.locked .app,body.locked .nav,body.locked #cartbar{display:none}
.auth{position:fixed;inset:0;z-index:300;background:#F1EBDC;display:none;overflow-y:auto;
padding:calc(30px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom))}
.auth.on{display:block}
.auth-box{max-width:420px;margin:0 auto}
.auth-logo{text-align:center;margin-bottom:4px}
.auth-logo img{height:42px}
.auth-slogan{text-align:center;font-size:12px;color:#4A4436;margin-bottom:26px;letter-spacing:.04em}
.auth-h{font-family:'Fraunces',serif;font-size:23px;font-weight:600;margin-bottom:5px;color:#1C1914}
.auth-s{font-size:13px;color:#4A4436;margin-bottom:18px;line-height:1.5}
.auth-msg{border-radius:10px;padding:11px 13px;font-size:12.5px;margin-bottom:14px;line-height:1.5}
.auth-msg.err{background:#F9EAE4;color:#7E2F1B;border-left:3px solid #7E2F1B}
.auth-msg.ok{background:#EAF2EC;color:#235A34;border-left:3px solid #235A34}
.auth-msg.info{background:#E9EFF4;color:#254A67;border-left:3px solid #254A67}
.auth-link{background:none;border:none;color:#7A4F0A;font-family:inherit;font-size:13px;
font-weight:600;cursor:pointer;text-decoration:underline;padding:9px 0;display:block;width:100%;text-align:center}
.auth-sep{display:flex;align-items:center;gap:10px;margin:16px 0;color:#4A4436;font-size:11.5px}
.auth-sep::before,.auth-sep::after{content:"";flex:1;height:1px;background:#C9B98D}
.code-box{background:#F8F2E5;border:1px dashed #D9BE85;border-radius:10px;padding:15px;
text-align:center;margin:13px 0}
.code-val{font-family:'Fraunces',serif;font-size:21px;font-weight:700;letter-spacing:.14em;color:#7A4F0A;word-break:break-all}
.code-lab{font-size:11px;color:#4A4436;margin-top:7px;line-height:1.45}
.gear{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);color:var(--ink,#1C1914);
padding:7px 9px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px;line-height:1}
.set-sec{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
color:var(--accent,#7A4F0A);font-weight:700;margin:20px 0 9px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;
border-bottom:1px solid var(--border,#C9B98D);font-size:13.5px}
.set-row:last-child{border-bottom:none}
.set-lab{color:var(--ink,#1C1914);font-weight:600}
.set-lab small{display:block;font-weight:400;font-size:11px;color:var(--steel-d,#4A4436);margin-top:2px;line-height:1.4}
.set-val{font-size:12.5px;color:var(--steel-d,#4A4436);text-align:right;flex-shrink:0}
.pill-etat{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.05em;
padding:4px 9px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.pill-etat.off{background:var(--surface-2,#E6DEC7);color:var(--steel-d,#4A4436)}
.pill-etat.on{background:var(--green-soft,#EAF2EC);color:var(--green,#235A34)}
.pill-etat.soon{background:var(--blue-soft,#E9EFF4);color:var(--blue,#254A67)}
.ano{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);border-left:3px solid var(--steel-d,#4A4436);
border-radius:11px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow-card)}
.ano.rouge{border-left-color:var(--red,#7E2F1B)}
.ano.ambre{border-left-color:var(--amber,#7A4F0A)}
.ano.bleu{border-left-color:var(--blue,#254A67)}
.ano-t{font-size:13px;font-weight:700;color:var(--ink,#1C1914);line-height:1.4}
.ano-d{font-size:11.5px;color:var(--steel-d,#4A4436);margin-top:3px;line-height:1.45}
.dos-row{display:grid;grid-template-columns:1fr 62px 66px 56px;gap:8px;align-items:center;
padding:10px 0;border-bottom:1px solid var(--border,#C9B98D)}
.dos-h{display:grid;grid-template-columns:1fr 62px 66px 56px;gap:8px;padding-bottom:8px;
border-bottom:1px solid var(--border,#C9B98D);font-size:9.5px;letter-spacing:.06em;
color:var(--steel-d,#4A4436);font-weight:700;text-transform:uppercase}
.dos-h span:not(:first-child){text-align:right}
.dos-n{font-size:12.5px;font-weight:600;color:var(--ink,#1C1914)}
.dos-th{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;text-align:right;color:var(--steel-d,#4A4436)}
.dos-in{width:100%;background:var(--surface-2,#E6DEC7);border:1.5px solid var(--border,#C9B98D);
border-radius:8px;padding:8px 4px;color:var(--ink,#1C1914);font-family:'Inter',sans-serif;
font-size:13px;font-weight:700;text-align:center;outline:none}
.dos-ec{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:800;text-align:right}

/* ── MENU LATÉRAL ── */
.nav{display:none}                     /* ancienne barre du bas retirée */
.burger{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);
color:var(--ink,#1C1914);width:38px;height:38px;border-radius:11px;cursor:pointer;
font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:4px;flex-shrink:0;padding:0}
.burger i{display:block;width:16px;height:2px;background:var(--ink,#1C1914);border-radius:2px;
transition:transform .22s ease,opacity .18s ease}
.burger.open i:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.open i:nth-child(2){opacity:0}
.burger.open i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

.dr-bg{position:fixed;inset:0;z-index:190;background:rgba(28,25,20,.42);
opacity:0;pointer-events:none;transition:opacity .24s ease}
.dr-bg.on{opacity:1;pointer-events:auto}

.drawer{position:fixed;top:0;bottom:0;left:0;z-index:200;width:76%;max-width:290px;
background:var(--surface,#FFFFFF);border-right:1px solid var(--border,#C9B98D);
box-shadow:2px 0 24px rgba(28,25,20,.14);
transform:translateX(-102%);transition:transform .26s cubic-bezier(.32,.72,.3,1);
display:flex;flex-direction:column;
padding:calc(20px + env(safe-area-inset-top)) 0 calc(16px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
overflow-y:auto}
.drawer.on{transform:translateX(0)}
.dr-head{padding:0 20px 16px;border-bottom:1px solid var(--border,#C9B98D);margin-bottom:12px}
.dr-head img{height:28px;display:block}
.dr-etab{font-size:11.5px;color:var(--steel-d,#4A4436);margin-top:7px}
.dr-list{padding:0 12px;flex:1}
.dr-item{width:100%;background:none;border:none;cursor:pointer;font-family:inherit;
display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:11px;
font-size:14.5px;font-weight:600;color:var(--ink,#1C1914);text-align:left;
transition:background .15s;position:relative;margin-bottom:2px}
.dr-item:active{background:var(--surface-2,#E6DEC7)}
.dr-item.on{background:var(--accent-soft,#F8F2E5);color:var(--accent,#7A4F0A)}
.dr-item .di{font-size:19px;width:24px;text-align:center;flex-shrink:0}
.dr-badge{margin-left:auto;background:var(--blue,#254A67);color:#fff;font-size:10.5px;
font-weight:800;min-width:20px;height:20px;border-radius:999px;display:flex;
align-items:center;justify-content:center;padding:0 6px;font-family:'Inter',sans-serif}
.dr-badge.amb{background:var(--amber,#7A4F0A)}
.dr-sep{height:1px;background:var(--border,#C9B98D);margin:10px 12px}
.dr-foot{padding:0 20px;font-size:10.5px;color:var(--steel-d,#4A4436);line-height:1.5}

/* ── SCAN DES BONS DE LIVRAISON ── */
.scan-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.scan-actions .desktop-scan-note{margin-bottom:0;display:flex;align-items:center;text-align:left}
.scan-btn{background:var(--surface,#FFFFFF);border:1px solid var(--border,#C9B98D);border-radius:13px;
padding:16px 12px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;
align-items:center;gap:7px;color:var(--ink,#1C1914);box-shadow:var(--shadow-card);transition:transform .1s}
.scan-btn:active{transform:scale(.97)}
.scan-btn.primary{background:var(--accent,#7A4F0A);border-color:var(--accent,#7A4F0A);color:#fff}
.scan-btn .sb-i{font-size:23px;line-height:1}
.scan-btn .sb-l{font-size:13px;font-weight:700;text-align:center;line-height:1.3}
.viseur{margin-bottom:15px}
.viseur-cadre{position:relative;height:150px;border-radius:12px;
background:repeating-linear-gradient(45deg,var(--surface-2,#E6DEC7),var(--surface-2,#E6DEC7) 10px,var(--surface,#FFF) 10px,var(--surface,#FFF) 20px);
display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.vc{position:absolute;width:26px;height:26px;border:3px solid var(--accent,#7A4F0A)}
.vc.c1{top:10px;left:10px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
.vc.c2{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
.vc.c3{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 6px}
.vc.c4{bottom:10px;right:10px;border-left:none;border-top:none;border-radius:0 0 6px 0}
.viseur-txt{font-size:12.5px;font-weight:700;color:var(--accent,#7A4F0A);
background:var(--surface,#FFF);padding:7px 14px;border-radius:999px;text-align:center;max-width:78%}
.viseur-conseils{list-style:none;padding:0;margin:0}
.viseur-conseils li{font-size:11.5px;color:var(--steel-d,#4A4436);padding:4px 0 4px 20px;
position:relative;line-height:1.45}
.viseur-conseils li::before{content:"›";position:absolute;left:6px;color:var(--accent,#7A4F0A);font-weight:800}
.qual{border-radius:11px;padding:12px 14px;margin-bottom:14px;border-left:3px solid var(--steel-d,#4A4436)}
.qual.ok{background:var(--green-soft,#EAF2EC);border-left-color:var(--green,#235A34)}
.qual.moy{background:var(--amber-soft,#F8F2E5);border-left-color:var(--amber,#7A4F0A)}
.qual.ko{background:var(--red-soft,#F9EAE4);border-left-color:var(--red,#7E2F1B)}
.qual-t{display:flex;justify-content:space-between;align-items:center;gap:12px;
font-size:12.5px;font-weight:700;color:var(--ink,#1C1914)}
.qual-j{flex:0 0 62px;height:6px;background:rgba(28,25,20,.14);border-radius:999px;overflow:hidden}
.qual-j i{display:block;height:100%;border-radius:999px;background:var(--green,#235A34)}
.qual.moy .qual-j i{background:var(--amber,#7A4F0A)}
.qual.ko .qual-j i{background:var(--red,#7E2F1B)}
.qual-verdict{font-size:12px;font-weight:700;margin-top:6px;line-height:1.45}
.pv-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border,#C9B98D)}
.pv-row.modif{background:var(--accent-soft,#F8F2E5);margin:0 -8px;padding:11px 8px;border-radius:8px}
.pv-ico{font-size:19px;width:25px;text-align:center;flex-shrink:0}
.pv-body{flex:1;min-width:0}
.pv-n{font-size:13.5px;font-weight:600;color:var(--ink,#1C1914);line-height:1.3}
.pv-m{font-size:10.5px;color:var(--steel-d,#4A4436);margin-top:2px}
.pv-in{display:flex;align-items:center;gap:5px;flex-shrink:0}
.pv-in input{width:74px;background:var(--surface-2,#E6DEC7);border:1.5px solid var(--border,#C9B98D);
border-radius:9px;padding:9px 6px;color:var(--ink,#1C1914);font-family:'Inter',sans-serif;
font-size:14px;font-weight:700;text-align:center;outline:none}
.pv-in input:focus{border-color:var(--accent,#7A4F0A);background:var(--surface,#FFF)}
.pv-in span{font-size:12.5px;color:var(--steel-d,#4A4436);font-weight:600}
.pv-masse{background:var(--surface,#FFF);border:1px solid var(--border,#C9B98D);border-radius:11px;
padding:11px 13px;margin-bottom:13px;box-shadow:var(--shadow-card)}
.pv-masse-l{font-size:11.5px;color:var(--steel-d,#4A4436);display:block;margin-bottom:8px}
.pv-masse-b{display:flex;gap:7px;flex-wrap:wrap}
.pv-actions{display:flex;gap:9px;margin:18px 0 8px;position:sticky;bottom:0;
background:var(--bg,#F1EBDC);padding:10px 0}
.qual-l{margin:8px 0 0;padding-left:18px}
.qual-l li{font-size:11.5px;line-height:1.5;color:var(--ink,#1C1914)}
.qual-ok{font-size:11.5px;color:var(--green,#235A34);margin-top:5px}
.qual-a{font-size:11.5px;margin-top:8px;font-weight:600;color:var(--red,#7E2F1B)}
.pg img.pg-ko{border-color:var(--red,#7E2F1B);border-width:2px}
.pg img.pg-moy{border-color:var(--amber,#7A4F0A);border-width:2px}
.pg img.pg-ok{border-color:var(--green,#235A34);border-width:2px}
.pg-q{position:absolute;top:-6px;left:-6px;min-width:22px;height:22px;border-radius:999px;
font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;
padding:0 5px;color:#fff;background:var(--steel-d,#4A4436);border:2px solid var(--surface,#FFF)}
.pg-q.pg-ok{background:var(--green,#235A34)}
.pg-q.pg-moy{background:var(--amber,#7A4F0A)}
.pg-q.pg-ko{background:var(--red,#7E2F1B)}
.pages{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.pg{position:relative;flex-shrink:0}
.pg img{width:74px;height:96px;object-fit:cover;border-radius:9px;border:1px solid var(--border,#C9B98D);display:block}
.pg-x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:999px;
background:var(--red,#7E2F1B);color:#fff;border:2px solid var(--surface,#FFFFFF);font-size:12px;
cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
.pg-n{position:absolute;bottom:4px;left:4px;background:rgba(28,25,20,.72);color:#fff;
font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:999px}
.pg-add{width:74px;height:96px;border-radius:9px;border:1.5px dashed var(--border,#C9B98D);

.dashboard-state{max-width:1180px;min-height:260px;margin:0 auto;display:flex;align-items:center;justify-content:center;padding:24px}
.dashboard-state-card{width:min(100%,520px);padding:28px;border:1px solid #e1dbd1;border-radius:18px;background:#fff;text-align:center;box-shadow:0 8px 24px rgba(29,26,22,.06)}
.dashboard-state-card b{display:block;margin-bottom:7px;color:#2f2a24;font:600 22px Fraunces,Georgia,serif}.dashboard-state-card span{display:block;color:#827768;font:500 12px/1.5 Inter,system-ui,sans-serif}
.dashboard-state-card button{margin-top:16px;padding:10px 14px;border:0;border-radius:10px;background:#7a4f0a;color:#fff;font:700 11px Inter,system-ui,sans-serif;cursor:pointer}
.dashboard-loader{width:28px;height:28px;margin:0 auto 14px;border:3px solid #e6dfd2;border-top-color:#a67a23;border-radius:50%;animation:dashboard-spin .8s linear infinite}
@keyframes dashboard-spin{to{transform:rotate(360deg)}}
.profile-setting-help{display:block;margin-top:6px;color:#746b60;font:500 10px/1.45 Inter,system-ui,sans-serif}
@media(max-width:759px){.profile-dashboard{gap:12px;padding-bottom:20px}.profile-dashboard .profile-head{align-items:flex-start;flex-direction:column;gap:13px;padding-bottom:15px}.profile-dashboard .profile-change{width:100%}.profile-dashboard .profile-metrics,.profile-dashboard .profile-metrics.two{grid-template-columns:1fr 1fr;gap:9px}.profile-dashboard .profile-metric{min-height:132px;padding:15px}.profile-dashboard .profile-metric.wide{grid-column:span 2}.profile-dashboard .profile-value{font-size:29px}}
@media(max-width:480px){.profile-dashboard .profile-metrics,.profile-dashboard .profile-metrics.two{grid-template-columns:1fr}.profile-dashboard .profile-metric.wide{grid-column:auto}.profile-dashboard .profile-breakdown{grid-template-columns:1fr}.profile-dashboard h1{font-size:34px}}

/* Hachage du mot de passe.
   PBKDF2 via Web Crypto quand le contexte est sécurisé (https).
   Repli simple sinon (ouverture en fichier local) — signalé à l'utilisateur. */
let hashFaible=false;
async function hashPwd(pwd,salt){
 try{
  if(window.crypto&&crypto.subtle&&window.isSecureContext){
   const enc=new TextEncoder();
   const k=await crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveBits']);
   const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},k,256);
   return 'pbkdf2:'+btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
  }
 }catch(e){}
 hashFaible=true;
 let x=0;const s=pwd+'|'+salt;
 for(let i=0;i<s.length;i++){x=((x<<5)-x)+s.charCodeAt(i);x|=0}
 return 'simple:'+Math.abs(x).toString(36);
}

/* ── Création de compte ── */
async function creerCompte(nom,mail,etab,pwd,pwd2){
 mail=normMail(mail);
 if(!nom.trim()||!mail||!etab.trim()||!pwd)return{e:t('aChamps')};
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail))return{e:t('aMailInvalide')};
 if(pwd.length<8)return{e:t('aPwdCourt')};
 if(pwd!==pwd2)return{e:t('aPwdDiff')};
 if(auth.users[mail])return{e:t('aDejaPris')};
 const salt=rnd(16), code=rnd(4)+'-'+rnd(4), etabId=uid('etab');
 auth.users[mail]={mail,nom:nom.trim(),etabId,etabNom:etab.trim(),profilMetier:'',
  salt,hash:await hashPwd(pwd,salt),codeHash:await hashPwd(code,salt),cree:Date.now(),role:'gestion',statut:'actif'};
 await saveAuth();
 session={email:mail,etabId};await saveSess();
 /* Reprise éventuelle des données de la version précédente (sans compte) */
 const ancien=await Store.get('invo_v5');
 if(ancien&&!(await Store.get(dataKey())))await Store.set(dataKey(),ancien);
 return{ok:true,code};
}

/* ── Connexion ── */
async function connecter(mail,pwd){
 mail=normMail(mail);
 const u=auth.users[mail];
 if(!u)return{e:t('aIntrouvable')};
 if(await hashPwd(pwd,u.salt)!==u.hash)return{e:t('aMauvaisPwd')};
 u.derniereActivite=Date.now();u.statut='actif';await saveAuth();
 session={email:mail,etabId:u.etabId};await saveSess();
 return{ok:true};
}

/* ── Réinitialisation par code de secours ── */
async function reinit(mail,code,pwd,pwd2){
 mail=normMail(mail);
 const u=auth.users[mail];
 if(!u)return{e:t('aIntrouvable')};
 if(await hashPwd((code||'').trim().toUpperCase(),u.salt)!==u.codeHash)return{e:t('aCodeFaux')};
 if(pwd.length<8)return{e:t('aPwdCourt')};
 if(pwd!==pwd2)return{e:t('aPwdDiff')};
 u.hash=await hashPwd(pwd,u.salt);await saveAuth();
 return{ok:true};
}

function dlJson(data,name){

 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
 document.body.appendChild(a);a.click();document.body.removeChild(a);

  r.onload=()=>res(String(r.result||''));r.onerror=()=>rej(r.error||new Error('lecture'));

function coutMat(id,q){const c=item(id);if(!c)return 0;let v=0;
for(const [pid,x] of Object.entries(c.f||{}))v+=qteFicheEnStock(c,pid,x*q)*(prod(pid)?.px||0);return v}
const coutMv=m=>coutMat(m.plat,m.qty);
const pvMv=m=>{const c=item(m.plat);return c?c.pv*m.qty:0};
function deduire(id,q){const c=item(id);if(!c)return;
for(const [pid,x] of Object.entries(c.f||{}))st.stock[pid]=Math.max(0,(st.stock[pid]||0)-qteFicheEnStock(c,pid,x*q))}
/* ═══════════════════════════════════════════════════════════
   TRAÇABILITÉ DES MOUVEMENTS
   Chaîne obligatoire :
     PRODUIT ENREGISTRÉ → STOCK → VENTE/ENVOI → ANNULATION/OFFERT/PERTE
   Aucun mouvement ne peut exister sans produit au catalogue.
   Une annulation doit pointer vers la vente qu'elle annule.
   ═══════════════════════════════════════════════════════════ */

const MOTIFS_PRIMAIRES=['vente','envoi'];              /* créent la consommation */
const MOTIF_REVERSE='annul';                           /* restitue le stock */
/* Ces motifs ne créent jamais une seconde sortie de stock : ils qualifient
   une ligne déjà envoyée par la caisse ou enregistrée comme transaction. */
const MOTIFS_A_TRACER=['annul','offClient','offPart','offGroupe','casse','rate'];

/* Quantité d'une vente/envoi qui peut encore être qualifiée ou annulée.
   Une même quantité ne peut recevoir qu'une seule qualification. */
function resteATracer(mvId){
 const p=(st.mv||[]).find(m=>String(m.id)===String(mvId));
 if(!p||!MOTIFS_PRIMAIRES.includes(p.motif))return 0;
 const deja=(st.mv||[])
  .filter(m=>MOTIFS_A_TRACER.includes(m.motif)&&String(m.parent)===String(mvId))
  .reduce((s,m)=>s+(m.qty||0),0);
 return Math.max(0,(p.qty||0)-deja);
}

/* Ventes/envois d'un produit encore qualifiables, du plus récent au plus ancien */
function ventesATracer(platId){
 return (st.mv||[])
  .filter(m=>MOTIFS_PRIMAIRES.includes(m.motif)&&m.plat===platId&&resteATracer(m.id)>0)
  .sort((a,b)=>new Date(b.ts)-new Date(a.ts));
}

/* Le stock permet-il cette sortie ? Renvoie les matières insuffisantes. */
function stockSuffisant(platId,q){
 const c=item(platId);
 if(!c||!c.f)return{ok:true,manques:[]};
 const manques=[];
 for(const [pid,x] of Object.entries(c.f)){
  const besoin=qteFicheEnStock(c,pid,x*q), dispo=st.stock[pid]||0;
  if(besoin>dispo+1e-9){
   const p=prod(pid);
   manques.push({id:pid,n:p?p.n:pid,u:p?p.u:'',besoin,dispo});
  }
 }
 return{ok:!manques.length,manques};
}

/* ── Validation : refuse tout mouvement incohérent ── */
function validerMouvement(m){
 /* 1. Le produit doit exister au catalogue */
 const c=item(m.plat);
 if(!m.plat||!c)return{ok:false,code:'produit_inconnu',
  msg:t('trProduitInconnu').replace('%p',m.platN||m.plat||'?')};

 /* 2. Quantité exploitable */
 const q=Number(m.qty);
 if(!(q>0)||!isFinite(q))return{ok:false,code:'quantite_invalide',msg:t('trQteInvalide')};

 /* 3. Motif connu */
 const motifsOk=[...MOTIFS_PRIMAIRES,MOTIF_REVERSE,...MOTIFS.map(x=>x.id)];
 if(!m.motif||!motifsOk.includes(m.motif))
  return{ok:false,code:'motif_inconnu',msg:t('trMotifInconnu')};

 /* 4. Annulation, offert et perte : toujours rattachés à une ligne primaire. */
 if(MOTIFS_A_TRACER.includes(m.motif)){
  if(!m.parent)return{ok:false,code:'annul_sans_parent',msg:t('trAnnulSansVente')};
  const p=(st.mv||[]).find(x=>String(x.id)===String(m.parent));
  if(!p)return{ok:false,code:'parent_absent',msg:t('trParentAbsent')};
  if(!MOTIFS_PRIMAIRES.includes(p.motif))
   return{ok:false,code:'parent_invalide',msg:t('trParentInvalide')};
  if(p.plat!==m.plat)
   return{ok:false,code:'parent_autre_produit',msg:t('trParentAutreProduit')};
  const reste=resteATracer(m.parent);
  if(reste<=0)return{ok:false,code:'deja_annule',msg:t('trDejaAnnule')};
  if(q>reste+1e-9)return{ok:false,code:'annul_trop',
   msg:t('trAnnulTrop').replace('%q',fmtQ(q)).replace('%r',fmtQ(reste))};
 }

 /* 5. Seules les transactions primaires et les sorties directes consomment le stock. */
 let alerte=null;
 if(!MOTIFS_A_TRACER.includes(m.motif)){
  const s=stockSuffisant(m.plat,q);
  if(!s.ok){
   alerte={code:'stock_insuffisant',
    msg:t('trStockInsuffisant').replace('%l',s.manques.slice(0,3)
     .map(x=>`${x.n} (${fmtQ(x.dispo)}/${fmtQ(x.besoin)} ${x.u})`).join(', ')),
    manques:s.manques};
  }
 }
 return{ok:true,alerte};
}

/* ── Création : seul point d'entrée autorisé pour écrire un mouvement ──
   Applique le stock uniquement après validation réussie. */
function creerMouvement(m,opts){
 opts=opts||{};
 const v=validerMouvement(m);
 if(!v.ok)return v;
 if(v.alerte&&!opts.forcer&&!opts.accepteAlerte)
  return{ok:false,code:v.alerte.code,msg:v.alerte.msg,alerte:v.alerte,confirmable:true};

 const c=item(m.plat);
 const q=Number(m.qty);

 /* Effet sur le stock : annulation restitue ; offert/perte qualifient sans déduire. */
 if(m.motif===MOTIF_REVERSE) rendreStock(m.plat,q);
 else if(!MOTIFS_A_TRACER.includes(m.motif))deduire(m.plat,q);

 const mv={
  id:m.id||(Date.now()+Math.random()),
  src:m.src||'main',
  motif:m.motif,
  plat:m.plat, platN:c.n, platI:c.i,
  qty:q,
  table:m.table||'—',
  who:m.who||st.who,
  ts:m.ts||new Date().toISOString(),
  parent:m.parent||null,
  chaine:m.parent?'qualification':'primaire'
 };
 if(m.ph)mv.ph=m.ph;
 if(v.alerte)mv.alerte=v.alerte.code;

 st.mv.unshift(mv);
 if(st.mv.length>250)st.mv.length=250;
 return{ok:true,mv,alerte:v.alerte||null};
}

/* ── Validation d'un lot : aucune écriture tant que tout le lot n'est pas cohérent. ── */
function validerLotMouvements(mouvements,opts){
 opts=opts||{};
 const refus=[],besoins={};
 for(const m of mouvements){
  const v=validerMouvement(m);
  if(!v.ok){refus.push({msg:v.msg,confirmable:false});continue}
  if(!MOTIFS_A_TRACER.includes(m.motif)){
   const c=item(m.plat);
   for(const [pid,x] of Object.entries(c.f||{})){
    const b=besoins[pid]||{q:0};
    b.q+=qteFicheEnStock(c,pid,x*Number(m.qty));besoins[pid]=b;
   }
  }
 }
 if(refus.length)return{ok:false,refus};
 if(!opts.forcer&&!opts.accepteAlerte){
  const manques=Object.entries(besoins).map(([id,b])=>{
   const p=prod(id),dispo=st.stock[id]||0;
   return{id,n:p?p.n:id,u:p?p.u:'',besoin:b.q,dispo};
  }).filter(x=>x.besoin>x.dispo+1e-9);
  if(manques.length){
   const msg=t('trStockInsuffisant').replace('%l',manques.slice(0,3)
    .map(x=>`${x.n} (${fmtQ(x.dispo)}/${fmtQ(x.besoin)} ${x.u})`).join(', '));
   return{ok:false,refus:[{msg,confirmable:true}]};
  }
 }
 return{ok:true,refus:[]};
}

/* Restitution de stock (annulation) */
function rendreStock(platId,q){
 const c=item(platId);
 if(!c||!c.f)return;
 for(const [pid,x] of Object.entries(c.f))st.stock[pid]=(st.stock[pid]||0)+qteFicheEnStock(c,pid,x*q);
}

/* Remonter la chaîne d'un mouvement, pour l'affichage */
function chaineMouvement(mvId){
 const m=(st.mv||[]).find(x=>x.id===mvId);
 if(!m)return[];
 const ch=[m];
 let cur=m,garde=0;
 while(cur&&cur.parent&&garde++<10){
  const p=(st.mv||[]).find(x=>x.id===cur.parent);
  if(!p)break;
  ch.push(p);cur=p;
 }
 return ch.reverse();
}

function resumeVentesDashboard(maintenant){
 const debut=new Date(maintenant);debut.setHours(0,0,0,0);
 const fin=new Date(debut);fin.setDate(fin.getDate()+1);
 const ventes=(st.mv||[]).filter(function(m){
  if(!m||m.motif!=='vente'||!m.ts)return false;
  const d=new Date(m.ts);return !isNaN(d.getTime())&&d>=debut&&d<fin;
 });
 return ventes.reduce(function(r,m){
  const c=item(m.plat),montant=pvMv(m);
  r.ca+=montant;r.nombreVentes+=1;
  if(c&&c.k==='drink')r.liquide+=montant;else if(c)r.solide+=montant;

function compressPhoto(file){
 const r=new FileReader();
 r.onload=ev=>{const img=new Image();
  img.onload=()=>{const max=420;let w=img.width,h=img.height;
   if(w>h&&w>max){h=h*max/w;w=max}else if(h>max){w=w*max/h;h=max}
   const c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(img,0,0,w,h);
   decPhoto=c.toDataURL('image/jpeg',0.55);renderDec();toast(t('photoOk'))};
  img.src=ev.target.result};
 r.readAsDataURL(file);
}

async function valider(){if(!panierCount()||!panierPret())return;
const now=new Date().toISOString();
const projets=[],refus=[];
for(const [id,q] of Object.entries(panier)){
 const ligneMotif=motifDuPanier(id);let parent=null;
 if(MOTIFS_A_TRACER.includes(ligneMotif)){
  const cand=ventesATracer(id);
  if(!cand.length){refus.push({id,msg:t('trAnnulSansVente')});continue}
  parent=cand[0].id;
 }
 projets.push({src:'main',motif:ligneMotif,plat:id,qty:q,who:st.who,ts:now,
  ph:decPhoto?1:0,parent});
}

/* Pré-vol du lot entier : aucune ligne ni aucun stock ne sont modifiés ici. */
if(!refus.length){
 const lot=validerLotMouvements(projets,{forcer:!!forcerStock});
 if(!lot.ok)refus.push(...lot.refus);
}
if(refus.length){
 const confirmable=refus.every(x=>x.confirmable);
 msgDec={type:confirmable?'warn':'err',
  txt:refus.map(x=>x.msg).join('<br>')+(confirmable?'<br><b>'+t('trAppuyerEncore')+'</b>':'')};
 if(confirmable)forcerStock=true;
 await save();renderDec();
 requestAnimationFrame(()=>{const feedback=document.getElementById('decFeedback');if(feedback)feedback.scrollIntoView({behavior:'smooth',block:'center'});toast(refus[0].msg)});
 return;
}

/* Le lot est validé : les écritures se font maintenant, sans état intermédiaire visible. */
const creations=[];
for(const projet of projets){
 const r=creerMouvement(projet,{accepteAlerte:true});
 if(!r.ok)throw new Error('Validation de lot incohérente : '+r.code);
 creations.push(r.mv);
}
msgDec=null;forcerStock=false;
if(decPhoto){
 const k='p'+Date.now();st.photos[k]=decPhoto;
 creations.forEach(m=>m.pk=k);
 const ks=Object.keys(st.photos);if(ks.length>25)delete st.photos[ks[0]];
}
await save();panier={};panierMotifs={};motif=null;motifLigneEditee=null;motifsOuverts=false;decPhoto=null;renderDec();toast(t('saved'))}

const ZONES_L=['bar','cave','cuisine','reserve'];
const zLabel=z=>t('z'+z.charAt(0).toUpperCase()+z.slice(1));

/* Ordre d'affichage persistant et indépendant pour chaque zone. */
function produitsZone(z){
 return st.prods.map((p,index)=>({p,index})).filter(x=>(x.p.z||'reserve')===z)
  .sort((a,b)=>{
   const ao=Number(a.p.displayOrder),bo=Number(b.p.displayOrder),av=Number.isFinite(ao),bv=Number.isFinite(bo);
   return av&&bv?ao-bo:(av?-1:(bv?1:a.index-b.index))})
  .map(x=>x.p);
}
function produitsOrdonnesToutesZones(){
 const ids=new Set(),liste=[];
 ZONES_L.forEach(z=>produitsZone(z).forEach(p=>{ids.add(p.id);liste.push(p)}));
 st.prods.forEach(p=>{if(!ids.has(p.id))liste.push(p)});
 return liste;
}
function normaliserZone(z){produitsZone(z).forEach((p,index)=>p.displayOrder=index)}
function prochainePositionZone(z){const ps=produitsZone(z);return ps.length?Math.max(...ps.map(p=>Number(p.displayOrder)||0))+1:0}
function planifierSauvegardeOrdre(){
 if(zoneOrderSaveTimer)clearTimeout(zoneOrderSaveTimer);
 zoneOrderSaveTimer=setTimeout(async()=>{zoneOrderSaveTimer=null;await save()},180);
}
window.addEventListener('pagehide',()=>{
 if(zoneOrderSaveTimer){clearTimeout(zoneOrderSaveTimer);zoneOrderSaveTimer=null;Store.set(dataKey(),st)}
});
async function deplacerProduitZone(id,action,cibleId){
 const p=prod(id);if(!p)return;
 const z=p.z||'reserve',liste=produitsZone(z),depart=liste.findIndex(x=>x.id===id);
 if(depart<0)return;
 let arrivee=depart;
 if(action==='first')arrivee=0;
 else if(action==='up')arrivee=Math.max(0,depart-1);
 else if(action==='down')arrivee=Math.min(liste.length-1,depart+1);
 else if(action==='last')arrivee=liste.length-1;
 else if(action==='before')arrivee=liste.findIndex(x=>x.id===cibleId);
 if(arrivee<0||arrivee===depart)return;
 const [moved]=liste.splice(depart,1);
 if(action==='before'&&depart<arrivee)arrivee--;
 liste.splice(arrivee,0,moved);liste.forEach((x,index)=>x.displayOrder=index);
 planifierSauvegardeOrdre();renderInv();
}

  (l.lines||[]).forEach(function(x){recues[x.id]=(recues[x.id]||0)+num(x.q)});

  return{id:l.id,q:Math.max(0,num(l.q)-num(recues[l.id]||0)),px:l.px};

}

function copyText(txt){
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).catch(()=>fallbackCopy(txt))}
 else fallbackCopy(txt);
}
function fallbackCopy(txt){
 const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
 document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}
 document.body.removeChild(ta);
}
